<!doctype html>
<!--
  base.html：スライドの土台。運用時は固定（D4）。AI は変更しない（12.4）。
  ビルドのスクリプトが、本文の中の次の5つの印を置き換えて deck.html を作る（この説明の中には印そのものを書かない。置き換えが説明に当たらないようにするため）。
    title の印       head の title 要素の中。デッキの題名
    TAILWIND の印    style の中。Tailwind が生成した CSS（theme.css のトークンを含む）
    FONT の印        style の中。サブセット化したフォントの @font-face
    SLIDES の印      main の中。スライド（1枚＝1つの section.slide）
    LICENSES の印    #licenses の中。ライセンスの全文（license-notice のスクリプトが生成。画面には出さない）
  スライドの書き方：
    section 要素に class="slide" と data-id="S01" を付け、中に本文を書く。
    発表者ノートは、その中の aside 要素（class="notes"）に書く。
  操作：
    → ↓ Space PageDown：次へ　← ↑ PageUp：前へ　Home / End：最初・最後
    p：発表モード（全画面）　s：発表者ビュー（別ウィンドウ）　Esc：一覧に戻る
    URL の末尾の #3 で3枚目を開く
  外部から何も読み込まない（D8）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
/*FONT*/
/*TAILWIND*/

/* ---- 土台：Tailwind のトークン（theme.css）を使う ---- */
:root { --slide-w: 1280px; --slide-h: 720px; --scale: 1; }
html, body { margin: 0; }
body { background: #333333; font-family: var(--font-sans); color: var(--color-ink); }

/* 一覧（既定）：縦にすべて並べる */
.deck { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0; }
.slide {
  width: var(--slide-w); height: var(--slide-h); flex: none;
  position: relative; overflow: hidden; box-sizing: border-box;
  background: var(--color-canvas); color: var(--color-ink);
  font-size: var(--text-body); line-height: var(--text-body--line-height);
  word-break: auto-phrase;
}
.slide .notes { display: none; }
.slide-no {
  position: absolute; right: var(--spacing-slide-x); bottom: var(--spacing-slide-bottom);
  font-size: var(--text-footer); line-height: var(--text-footer--line-height); color: var(--color-label);
}

/* 発表モード：1枚だけを画面いっぱいに */
body.present { background: #000000; overflow: hidden; }
body.present .deck { display: block; padding: 0; }
body.present .slide {
  display: none; position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--scale));
}
body.present .slide.active { display: block; }

/* 印刷・PDF：1枚＝1ページ */
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body, body.present { background: none; }
  .deck, body.present .deck { display: block; padding: 0; }
  .slide, body.present .slide {
    display: block !important; position: relative !important; transform: none !important;
    left: auto; top: auto; break-after: page;
  }
  .slide:last-of-type { break-after: auto; }
}

/* ライセンスの全文（画面にも印刷にも出さない） */
#licenses { display: none; }
</style>
</head>
<body>
<main class="deck">
<!--SLIDES-->
</main>
<div id="licenses" hidden>
<!--LICENSES-->
</div>
<script>
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  let current = 0;
  let presenter = null;   // 発表者ビューのウィンドウ
  let startedAt = null;   // 発表者ビューを開いた時刻

  // ページ番号（スライドの右下）
  slides.forEach((s, i) => {
    if (!s.querySelector(".slide-no")) {
      const n = document.createElement("div");
      n.className = "slide-no";
      n.textContent = `${i + 1} / ${slides.length}`;
      s.appendChild(n);
    }
  });

  const fit = () => {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    document.documentElement.style.setProperty("--scale", s);
  };

  const show = (i) => {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle("active", k === current));
    history.replaceState(null, "", `#${current + 1}`);
    if (!document.body.classList.contains("present")) {
      slides[current].scrollIntoView({ block: "center" });
    }
    renderPresenter();
  };

  // ---- 発表者ビュー：今のスライド、次のスライド、ノート、経過時間 ----
  // about:blank のウィンドウはこのページと同じ扱いになるため、file:// でも直接操作できる
  const openPresenter = () => {
    if (presenter && !presenter.closed) { presenter.focus(); return; }
    presenter = window.open("", "presenter", "width=1200,height=760");
    if (!presenter) return;
    startedAt = Date.now();
    const d = presenter.document;
    d.title = "発表者ビュー";
    d.body.innerHTML = `
      <style>
        ${[...document.querySelectorAll("style")].map(s => s.textContent).join("\n")}
        body { margin: 0; background: #1a1a1a; color: #ffffff; font-family: var(--font-sans); }
        .pv { display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: auto 1fr; gap: 16px; padding: 16px; height: 100vh; box-sizing: border-box; }
        .pv-box { position: relative; overflow: hidden; background: #000000; }
        .pv-box .slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
        .pv-cur { aspect-ratio: 16 / 9; }
        .pv-side { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; min-height: 0; }
        .pv-next { aspect-ratio: 16 / 9; opacity: .85; }
        .pv-meta { display: flex; justify-content: space-between; font-size: 20px; }
        .pv-notes { grid-column: 1 / -1; overflow: auto; font-size: 22px; line-height: 1.7; white-space: pre-wrap; background: #333333; padding: 16px; }
        .pv-label { font-size: 13px; color: #999999; }
      </style>
      <div class="pv">
        <div class="pv-box pv-cur" id="cur"></div>
        <div class="pv-side">
          <div class="pv-meta"><span id="pos"></span><span id="time">00:00</span></div>
          <div class="pv-label">次のスライド</div>
          <div class="pv-box pv-next" id="next"></div>
        </div>
        <div class="pv-notes" id="notes"></div>
      </div>`;
    presenter.addEventListener("keydown", onKey);
    presenter.addEventListener("resize", renderPresenter);
    renderPresenter();
  };

  const place = (box, slide) => {
    box.innerHTML = "";
    if (!slide) return;
    const c = slide.cloneNode(true);
    c.classList.remove("active");
    c.querySelector(".notes")?.remove();
    box.appendChild(c);
    c.style.transform = `scale(${box.clientWidth / 1280})`;
  };

  const renderPresenter = () => {
    if (!presenter || presenter.closed) return;
    const d = presenter.document;
    place(d.getElementById("cur"), slides[current]);
    place(d.getElementById("next"), slides[current + 1]);
    d.getElementById("pos").textContent = `${current + 1} / ${slides.length}`;
    d.getElementById("notes").textContent = slides[current].querySelector(".notes")?.textContent.trim() || "（ノートなし）";
  };

  setInterval(() => {
    if (!presenter || presenter.closed || startedAt === null) return;
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    const t = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    presenter.document.getElementById("time").textContent = t;
  }, 1000);

  // ---- キー操作 ----
  const onKey = (e) => {
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(current + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "p") {
      document.body.classList.toggle("present");
      if (document.body.classList.contains("present")) document.documentElement.requestFullscreen?.().catch(() => {});
      fit(); show(current);
    }
    else if (e.key === "Escape") { document.body.classList.remove("present"); show(current); }
    else if (e.key === "s") openPresenter();
  };

  addEventListener("keydown", onKey);
  addEventListener("resize", fit);
  addEventListener("hashchange", () => show(parseInt(location.hash.slice(1), 10) - 1 || 0));
  fit();
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
