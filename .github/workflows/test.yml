# テストと見本のビルド：PR ごとに、ハーネスが壊れていないかを確かめる
name: test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Python とそのパッケージは uv が入れる（.python-version・uv.lock）
      - uses: astral-sh/setup-uv@v6

      # README「2. セットアップ」と同じ手順（Linux では OS のライブラリも入れる）
      - name: セットアップ
        run: npm run setup

      - name: テスト
        run: npm test
      - name: 見本のビルド（検査と PDF まで）
        run: npm run build -- examples/sample-deck
      - name: ビルドの記録
        if: always()
        run: cat examples/sample-deck/build/build-log.md || true
